manifestVersion: 1
id: kevlen-hockeystats
name: HockeyStats
tagline: NHL Standings and Statistics
icon: https://github.com/kev-weatherston/umbrel-app-store/blob/master/kevlen-hockeystats/hockey.png?raw=true
category: Sports
version: "1.4.2"
port: 3000
description: >-
  View current NHL season leaderboard including player goals and points, as well as, team standings, grouped by overall league and division.
  Displays team logos, points, games played, wins, losses, and ties.
  Includes a widget view for Edmonton Oilers and Toronto Maple Leafs.
  
developer: kevin
submitter: kevin
repo: https://github.com/kev-weatherston/umbrel-app-store/kevlen-hockeystats
support: https://github.com/kev-weatherston/umbrel-app-store/kevlen-hockeystats/issues
gallery:
  - https://i.imgur.com/yyVG0Jb.jpeg
releaseNotes: >-
  Initial release with NHL standings display and widget support.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "hockeystats"
    type: "four-stats"
    refresh: "5m"
    endpoint: "server:3000/widgets/hockeystats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "EDM"
          text: "64"
          subtext: "Div #1"
          image: "https://assets.nhle.com/logos/nhl/svg/EDM_light.svg"
        - title: "TOR"
          text: "62"
          subtext: "Div #1"
          image: "https://assets.nhle.com/logos/nhl/svg/TOR_light.svg"
        - title: "Goals"
          text: "25"
          subtext: "Connor McDavid"
          image: "https://cms.nhl.bamgrid.com/images/headshots/current/168x168/8478402.jpg"
        - title: "Points"
          text: "45"
          subtext: "Nathan MacKinnon"
          image: "https://cms.nhl.bamgrid.com/images/headshots/current/168x168/8477492.jpg"
